<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-solutions-business-owners"><title id="title-solutions-business-owners">LossPacket Business owners illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lp-draw 2.6s cubic-bezier(.2,.7,.2,1) both}.enter{animation:lp-enter .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{animation:lp-highlight 2.8s ease-out both}.float{animation:lp-settle 4.2s ease-out both;transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(-1deg)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M57 40H286" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 12 / BUSINESS OWNERS</text><rect x="56" y="70" width="590" height="270" rx="4" class="paper"/><path d="M55 200H405V70 M205 200V340 M405 200H646" class="line" pathLength="1" style="animation-delay:0s"/><text x="96" y="115" class="mono" text-anchor="start">Synthetic premises</text><text x="105" y="266" class="" text-anchor="start">Counter / storage</text><text x="457" y="137" class="" text-anchor="start">Kitchen</text><text x="470" y="262" class="" text-anchor="start">Service area</text><rect x="461" y="152" width="110" height="38" rx="4" class="paper"/><text x="474" y="177" class="mono" text-anchor="start">DEMO PH-01</text><rect x="428" y="91" width="194" height="95" fill="#2F4B6E" opacity=".07" class="highlight"/><path d="M516 190V290H550" class="line draw" pathLength="1" style="animation-delay:0s"/><text x="567" y="310" class="small" text-anchor="start">Photo reference</text><text x="56" y="382" class="small muted" text-anchor="start">Illustrative location index. No hazard or coverage analysis.</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>