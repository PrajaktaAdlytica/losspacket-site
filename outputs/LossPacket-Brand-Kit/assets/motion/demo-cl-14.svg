<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-demo-cl-14"><title id="title-demo-cl-14">LossPacket Alder Oven demo illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lp-draw 2.6s cubic-bezier(.2,.7,.2,1) both}.enter{animation:lp-enter .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{animation:lp-highlight 2.8s ease-out both}.float{animation:lp-settle 4.2s ease-out both;transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(-1deg)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M57 40H310" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 16 / ALDER OVEN DEMO</text><path d="M75 168H652" class="line draw" pathLength="1" style="animation-delay:0s"/><circle cx="85" cy="168" r="17" fill="#F6F2EA" stroke="#2F4B6E"/><text x="85" y="173" class="" text-anchor="middle">1</text><text x="85" y="126" class="mono" text-anchor="middle">12 FEB</text><text x="85" y="216" class="small" text-anchor="middle">Loss reported</text><circle cx="265" cy="168" r="17" fill="#F6F2EA" stroke="#2F4B6E"/><text x="265" y="173" class="" text-anchor="middle">2</text><text x="265" y="126" class="mono" text-anchor="middle">18 FEB</text><text x="265" y="216" class="small" text-anchor="middle">Invoice source</text><circle cx="445" cy="168" r="17" fill="#F6F2EA" stroke="#2F4B6E"/><text x="445" y="173" class="" text-anchor="middle">3</text><text x="445" y="126" class="mono" text-anchor="middle">20 FEB</text><text x="445" y="216" class="small" text-anchor="middle">Request received</text><circle cx="625" cy="168" r="17" fill="#F6F2EA" stroke="#2F4B6E"/><text x="625" y="173" class="" text-anchor="middle">4</text><text x="625" y="126" class="mono" text-anchor="middle">03 MAR</text><text x="625" y="216" class="small" text-anchor="middle">Draft held</text><g class="enter" style="--delay:0.15s"><rect x="80" y="254" width="154" height="90" rx="4" class="paper"/><text x="94" y="278" class="mono" text-anchor="start">DEMO · PH-01</text><text x="94" y="304" class="small" text-anchor="start">Kitchen photo</text><text x="94" y="327" class="mono muted" text-anchor="start">Source linked</text></g><g class="enter" style="--delay:0.3s"><rect x="260" y="254" width="154" height="90" rx="4" class="paper"/><text x="274" y="278" class="mono" text-anchor="start">DEMO · R-09</text><text x="274" y="304" class="small" text-anchor="start">Repair invoice</text><text x="274" y="327" class="mono muted" text-anchor="start">$6,000</text></g><g class="enter" style="--delay:0.45s"><rect x="440" y="254" width="154" height="90" rx="4" class="paper"/><text x="454" y="278" class="mono" text-anchor="start">DEMO · REQ-01</text><text x="454" y="304" class="small" text-anchor="start">Insurer request</text><text x="454" y="327" class="mono muted" text-anchor="start">Due 06 MAR</text></g><rect x="112" y="359" width="496" height="48" rx="4" class="war