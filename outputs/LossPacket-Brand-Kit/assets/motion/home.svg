<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-home"><title id="title-home">LossPacket Home illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lp-draw 2.6s cubic-bezier(.2,.7,.2,1) both}.enter{animation:lp-enter .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{animation:lp-highlight 2.8s ease-out both}.float{animation:lp-settle 4.2s ease-out both;transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(-1deg)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M30 40H220" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 01 / HOME</text><g class="enter" style="--delay:0.0s"><rect x="55" y="84" width="154" height="90" rx="4" class="paper"/><text x="69" y="108" class="mono" text-anchor="start">DEMO · PH-01</text><text x="69" y="134" class="small" text-anchor="start">Incident photo</text><text x="69" y="157" class="mono muted" text-anchor="start">Source linked</text></g><g class="enter" style="--delay:0.2s"><rect x="217" y="72" width="154" height="90" rx="4" class="paper"/><text x="231" y="96" class="mono" text-anchor="start">DEMO · R-09</text><text x="231" y="122" class="small" text-anchor="start">Repair invoice</text><text x="231" y="145" class="mono muted" text-anchor="start">Source linked</text></g><g class="enter" style="--delay:0.4s"><rect x="379" y="60" width="154" height="90" rx="4" class="paper"/><text x="393" y="84" class="mono" text-anchor="start">DEMO · P-08</text><text x="393" y="110" class="small" text-anchor="start">Payroll summary</text><text x="393" y="133" class="mono muted" text-anchor="start">Source linked</text></g><path d="M132 176V215H365 M294 164V215 M456 152V215H365" class="line draw" pathLength="1" style="animation-delay:0s"/><rect x="244" y="220" width="244" height="102" rx="4" class="paper"/><text x="264" y="253" class="heading" text-anchor="start">Alder Oven / CL-14</text><text x="264" y="278" class="mono" text-anchor="start">Evidence packet · DRAFT</text><text x="264" y="303" class="small" text-anchor="start">Professional review pending</text><rect x="94" y="347" width="532" height="48" rx="4" class="warning"/><text x="112" y="376" class="small warning-text" text-anchor="start">Reopening evidence missing</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>