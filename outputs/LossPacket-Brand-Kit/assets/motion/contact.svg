<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-contact"><title id="title-contact">LossPacket Contact illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lp-draw 2.6s cubic-bezier(.2,.7,.2,1) both}.enter{animation:lp-enter .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{animation:lp-highlight 2.8s ease-out both}.float{animation:lp-settle 4.2s ease-out both;transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(-1deg)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M57 40H382" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 28 / CONTACT</text><rect x="162" y="94" width="414" height="205" rx="4" class="paper"/><path d="M162 94L369 223L576 94" class="line draw" pathLength="1" style="animation-delay:0s"/><text x="228" y="173" class="small" text-anchor="start">A specific next question</text><text x="247" y="265" class="mono muted" text-anchor="start">No claim attachments</text><text x="129" y="382" class="small muted" text-anchor="start">General contact / pilot / walkthrough are separate intents.</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>