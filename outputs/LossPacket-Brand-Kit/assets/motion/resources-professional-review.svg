<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-resources-professional-review"><title id="title-resources-professional-review">LossPacket Preparing for review illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lp-draw 2.6s cubic-bezier(.2,.7,.2,1) both}.enter{animation:lp-enter .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{animation:lp-highlight 2.8s ease-out both}.float{animation:lp-settle 4.2s ease-out both;transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(-1deg)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M39 40H370" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 26 / PREPARING FOR REVIEW</text><rect x="36" y="117" width="214" height="169" rx="4" class="paper"/><circle cx="71" cy="156" r="17" fill="#F6F2EA" stroke="#2F4B6E"/><text x="71" y="161" class="" text-anchor="middle">1</text><text x="56" y="205" class="small" text-anchor="start">Gather evidence</text><text x="56" y="242" class="mono muted" text-anchor="start">Source IDs and dates</text><path d="M250 197h20" class="line draw" pathLength="1" style="animation-delay:0s"/><rect x="270" y="117" width="214" height="169" rx="4" class="paper"/><circle cx="305" cy="156" r="17" fill="#F6F2EA" stroke="#2F4B6E"/><text x="305" y="161" class="" text-anchor="middle">2</text><text x="290" y="205" class="small" text-anchor="start">Professional review</text><text x="290" y="242" class="mono muted" text-anchor="start">Open questions held</text><path d="M484 197h20" class="line draw" pathLength="1" style="animation-delay:0s"/><rect x="504" y="117" width="214" height="169" rx="4" class="paper"/><circle cx="539" cy="156" r="17" fill="#F6F2EA" stroke="#2F4B6E"/><text x="539" y="161" class="" text-anchor="middle">3</text><text x="524" y="205" class="small" text-anchor="start">Owner-approved draft</text><text x="524" y="242" class="mono muted" text-anchor="start">Possible later state</text><rect x="105" y="337" width="510" height="48" rx="4" class="warning"/><text x="123" y="366" class="small warning-text" text-anchor="start">Review does not mean insurer approval.</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>