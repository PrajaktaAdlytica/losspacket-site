<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-legal-terms"><title id="title-legal-terms">LossPacket Terms illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lp-draw 2.6s cubic-bezier(.2,.7,.2,1) both}.enter{animation:lp-enter .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{animation:lp-highlight 2.8s ease-out both}.float{animation:lp-settle 4.2s ease-out both;transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(0)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M48 40H400" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 31 / TERMS</text><rect x="40" y="56" width="330" height="266" rx="4" class="paper"/><text x="62" y="88" class="mono" text-anchor="start">POL-01 / synthetic excerpt</text><text x="62" y="125" class="heading" text-anchor="start">Suspension and expense</text><text x="62" y="154" class="small muted" text-anchor="start">Questions remain policy-specific.</text><path d="M62 180H314" class="rule"/><path d="M62 205H287" class="rule"/><path d="M62 230H306" class="rule"/><path d="M62 255H242" class="rule"/><rect x="57" y="197" width="250" height="22" fill="#E7E1D5" class="highlight" opacity=".8"/><path d="M370 210H403V152H430" class="line draw" pathLength="1" style="animation-delay:0s"/><rect x="430" y="104" width="255" height="180" rx="4" class="paper"/><text x="446" y="137" class="heading" text-anchor="start">Question for review</text><text x="446" y="169" class="small" text-anchor="start">Which suspension end date?</text><text x="446" y="204" class="mono" text-anchor="start">22 FEB / 25 FEB</text><text x="446" y="241" class="small muted" text-anchor="start">No coverage determination</text><rect x="80" y="353" width="560" height="48" rx="4" class="warning"/><text x="98" y="382" class="small warning-text" text-anchor="start">Reopening evidence missing</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>