<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-resources"><title id="title-resources">LossPacket Resources illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;}.enter{animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{}.float{transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(0)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M48 40H352" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 23 / RESOURCES</text><g class="float" style="animation-delay:0.0s"><rect x="76" y="105" width="165" height="212" rx="4" class="paper"/><text x="93" y="149" class="mono" text-anchor="start">GUIDE 01</text><text x="93" y="191" class="small" text-anchor="start">Documents</text><path d="M93 222h128 M93 245h106" class="line" pathLength="1" style="animation-delay:0s"/></g><g class="float" style="animation-delay:0.2s"><rect x="278" y="105" width="165" height="212" rx="4" class="paper"/><text x="295" y="149" class="mono"