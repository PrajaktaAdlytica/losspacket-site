<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-pricing"><title id="title-pricing">LossPacket Pilot pricing illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;}.enter{animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{}.float{transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(0)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M30 40H316" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 17 / PILOT PRICING</text><rect x="56" y="62" width="610" height="290" rx="4" class="paper"/><text x="80" y="95" class="heading" text-anchor="start">Business-income working paper</text><text x="80" y="123" class="mono muted" text-anchor="start">CL-14 · DEMO · USD</text><text x="80" y="163" class="" text-anchor="start">Prior-period revenue</text><text x="637" y="163" class="mono" text-anchor="end">$28,000</text><path d="M80 180H642" class="rule"/><text x="80" y="214" class="" text-anchor="start">Incident-period revenue</text><text x="637" y="214" class="mono" text-anchor="end">$4,000</text><path d="M80 231H642" class="rule"/><text x="80" y="265" class="" text-anchor="start">Illustrative revenue difference</text><text x="637" y="265" class="mono" text-anchor="end">$24,000</text><path d="M80 282H642" class="rule"/><text x="80" y="327" class="small muted" text-anchor="start">Not a payout estimate. Payroll classification unresolved.</text><rect x="96" y="370" width="528" height="48" rx="4" class="warning"/><text x="114" y="399" class="small warning-text" text-anchor="start">Suspension dates and expense treatment need review.</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>