<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-404"><title id="title-404">LossPacket Page recovery illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:lp-draw 2.6s cubic-bezier(.2,.7,.2,1) both}.enter{animation:lp-enter .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{animation:lp-highlight 2.8s ease-out both}.float{animation:lp-settle 4.2s ease-out both;transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(0)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M30 40H412" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 33 / PAGE RECOVERY</text><path d="M92 195H281 M393 195H631" class="line draw" pathLength="1" style="animation-delay:0s"/><rect x="280" y="137" width="114" height="117" rx="4" class="paper"/><text x="337" y="208" class="heading" text-anchor="middle">404</text><g class="enter" style="--delay:0s"><rect x="458" y="271" width="154" height="90" rx="4" class="paper"/><text x="472" y="295" class="mono" text-anchor="start">DEMO · INDEX</text><text x="472" y="321" class="small" text-anchor="start">Return to the file</text><text x="472" y="344" class="mono muted" text-anchor="start">Source linked</text></g><text x="89" y="324" class="small muted" text-anchor="start">The page is missing. Your next route is visible.</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>