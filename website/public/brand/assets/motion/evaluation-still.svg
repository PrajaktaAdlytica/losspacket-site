<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-evaluation"><title id="title-evaluation">LossPacket Evaluation plan illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;}.enter{animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{}.float{transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(0)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M30 40H340" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 21 / EVALUATION PLAN</text><rect x="58" y="69" width="610" height="277" rx="4" class="paper"/><text x="80" y="104" class="heading" text-anchor="start">Pilot scorecard · no results yet</text><text x="82" y="159" class="" text-anchor="start">Reviewer-confirmed evidence gaps</text><text x="640" y="159" class="mono muted" text-anchor="end">Not measured</text><path d="M82 177H642" class="rule"/><text x="82" y="222" class="" text-anchor="start">Owner preparation hours</text><text x="640" y="222" class="mono muted" text-anchor="end">Not measured</text><path d="M82 240H642" class="rule"/><text x="82" y="285" class="" text-anchor="start">Verified paid-pilot commitment</text><text x="640" y="285" class="mono muted" text-anchor="end">Not measured</text><path d="M82 303H642" class="rule"/><text x="79" y="383" class="small muted" text-anchor="start">Evaluation method, never a fabricated ROI counter.</text><text x="38" y="433" class="mono muted" text-anchor="start">DEMO — SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>