<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-workspace"><title id="title-workspace">LossPacket Shared workspace illustrative hero diagram</title><style>text{font-family:"IBM Plex Sans",Arial,sans-serif;fill:#1B2230;font-size:16px}.mono{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em}.heading{font-family:"Source Serif 4",Georgia,serif;font-size:25px}.muted{fill:#556170}.small{font-size:13px}.paper{fill:#FFFDFA;stroke:#D4CEC3;stroke-width:1}.line{fill:none;stroke:#2F4B6E;stroke-width:1.5}.rule{stroke:#D4CEC3;stroke-width:1}.warning{fill:#FAEACF;stroke:#C98A2B}.warning-text{fill:#78500E}.draw{stroke-dasharray:1;stroke-dashoffset:0;}.enter{animation-delay:var(--delay,0s);transform-box:fill-box;transform-origin:center}.highlight{}.float{transform-box:fill-box;transform-origin:center}.paused *{animation-play-state:paused!important}.reduced *{}@keyframes lp-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes lp-enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes lp-highlight{from{opacity:.25}to{opacity:1}}@keyframes lp-settle{from{transform:translateY(10px) rotate(0)}to{transform:translateY(0) rotate(0)}}@media(prefers-reduced-motion:reduce){*{}}</style><rect width="720" height="450" fill="#F6F2EA"/><path d="M39 40H274" class="rule" pathLength="1" style="animation-delay:0s"/><text x="36" y="30" class="mono muted" text-anchor="start">FOLIO 10 / SHARED WORKSPACE</text><g class="enter" style="--delay:0.0s"><rect x="66" y="101" width="154" height="90" rx="4" class="paper"/><text x="80" y="125" class="mono" text-anchor="start">DEMO · DEMO</text><text x="80" y="151" class="small" text-anchor="start">Source v1</text><text x="80" y="174" class="mono muted" text-anchor="start">Source linked</text></g><path d="M220 146h71" class="line draw" pathLength="1" style="animation-delay:0s"/><g class="enter" style="--delay:0.25s"><rect x="291" y="101" width="