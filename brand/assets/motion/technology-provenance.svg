<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title-technology-provenance"><title id="title-technology-provenance">LossPacket technology provenance motion study</title><style>text{font:14px "IBM Plex Sans",Arial,sans-serif;fill:#1B2230}.mono{font:12px "IBM Plex Mono",monospace;fill:#556170}.rule{fill:none;stroke:#2F4B6E;stroke-width:1;stroke-opacity:.24}.trace{fill:none;stroke:#2F4B6E;stroke-width:1.5;stroke-dasharray:1;animation:trace 3.6s ease-out both}.reveal{animation:reveal .8s ease-out both;animation-delay:var(--d,0s)}@keyframes trace{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.paused *{animation-play-state:paused!important}.reduced *{animation:none!important}</style><rect width="720" height="450" fill="#F6F2EA"/><text x="34" y="43" class="mono">PROVENANCE / SOURCE AND VERSION</text><g class="reveal" style="--d:0.0s"><rect x="62" y="135" width="150" height="126" rx="3" fill="#FFFDFA" stroke="#7C8793"/><text x="78" y="174">Source</text><text x="78" y="208" class="mono">Date + origin</text><path d="M78 234h114" class="rule"/></g><path d="M212 198h74" class="trace" pathLength="1"/><g class="reveal" style="--d:0.3s"><rect x="286" y="135" width="150" height="126" rx="3" fill="#FFFDFA" stroke="#7C8793"/><text x="302" y="174">Working paper</text><text x="302" y="208" class="mono">v1 + notes</text><path d="M302 234h114" class="rule"/></g><path d="M436 198h74" class="trace" pathLength="1"/><g class="reveal" style="--d:0.6s"><rect x="510" y="135" width="150" height="126" rx="3" fill="#FFFDFA" stroke="#7C8793"/><text x="526" y="174">Review event</text><text x="526" y="208" class="mono">Actor + reason</text><path d="M526 234h114" class="rule"/></g><path d="M585 261V318H137V261" class="trace" pathLength="1"/><text x="212" y="350">A change creates a new review requirement.<